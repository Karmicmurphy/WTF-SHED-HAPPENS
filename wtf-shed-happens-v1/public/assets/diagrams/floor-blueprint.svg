<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18314b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="820" fill="#07131f"/>
  <rect width="1200" height="820" fill="url(#grid)" opacity=".8"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="60" y="60" fill="#f7f3e8" font-size="36" font-weight="800">YOUR FLOOR — 24' × 16'</text>
    <text x="60" y="98" fill="#9fb6c9" font-size="18">Interactive concept diagram — tap labels in the app to isolate parts</text>

    <!-- outer rim -->
    <rect x="170" y="170" width="840" height="460" fill="none" stroke="#f7f3e8" stroke-width="18"/>

    <!-- 3 runners -->
    <g stroke="#d6a544" stroke-width="18">
      <line x1="230" y1="170" x2="230" y2="630"/>
      <line x1="590" y1="170" x2="590" y2="630"/>
      <line x1="950" y1="170" x2="950" y2="630"/>
    </g>

    <!-- joists -->
    <g stroke="#8ec4df" stroke-width="10">
      <line x1="170" y1="210" x2="1010" y2="210"/>
      <line x1="170" y1="270" x2="1010" y2="270"/>
      <line x1="170" y1="330" x2="1010" y2="330"/>
      <line x1="170" y1="390" x2="1010" y2="390"/>
      <line x1="170" y1="450" x2="1010" y2="450"/>
      <line x1="170" y1="510" x2="1010" y2="510"/>
      <line x1="170" y1="570" x2="1010" y2="570"/>
    </g>

    <!-- piers -->
    <g fill="#b9b5aa" stroke="#69675f" stroke-width="3">
      <rect x="205" y="150" width="50" height="32" rx="4"/>
      <rect x="205" y="365" width="50" height="32" rx="4"/>
      <rect x="205" y="618" width="50" height="32" rx="4"/>
      <rect x="565" y="150" width="50" height="32" rx="4"/>
      <rect x="565" y="365" width="50" height="32" rx="4"/>
      <rect x="565" y="618" width="50" height="32" rx="4"/>
      <rect x="925" y="150" width="50" height="32" rx="4"/>
      <rect x="925" y="365" width="50" height="32" rx="4"/>
      <rect x="925" y="618" width="50" height="32" rx="4"/>
    </g>

    <text x="230" y="690" fill="#d6a544" font-size="22" text-anchor="middle" font-weight="700">RUNNER / BEAM</text>
    <text x="590" y="690" fill="#d6a544" font-size="22" text-anchor="middle" font-weight="700">CENTER BEAM</text>
    <text x="950" y="690" fill="#d6a544" font-size="22" text-anchor="middle" font-weight="700">RUNNER / BEAM</text>
    <text x="1030" y="390" fill="#8ec4df" font-size="22" font-weight="700">JOISTS →</text>
    <text x="590" y="755" fill="#f7f3e8" font-size="18" text-anchor="middle">Diagram is for learning/layout — verify actual lumber, spans, supports, and connections before building.</text>
  </g>
</svg>