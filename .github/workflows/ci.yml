name: WTF Shed Happens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          node --check public/app-v3.js
          node --check public/sw.js
          node --check src/index.js

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8')); console.log('JSON OK')"

      - name: Install dependencies
        run: npm install

      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
