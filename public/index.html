<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070812">
  <meta name="description" content="WTF — Shed Happens: stupid-simple visual building help with voice, AI, images, cloud backup, and project-only web research.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles-v4.css">
  <link rel="stylesheet" href="/styles-v5.css">
  <title>WTF — Shed Happens</title>
</head>
<body>
  <div class="wood" aria-hidden="true"></div>
  <header class="wtf-banner">
    <div class="banner-inner">
      <img class="banner-logo" src="/logo-v5.svg" alt="WTF blueprint shed frame logo">
      <div class="banner-copy">
        <h1><span>WTF STUPID SIMPLE</span></h1>
        <strong>SHED <em>HAPPENS</em></strong>
        <p class="banner-tag">Start with <b>24 × 16.</b> What's your fucking idea?</p>
      </div>
      <nav class="banner-nav" aria-label="Main navigation">
        <button data-route="build"><span>🔨</span>BUILD</button>
        <button data-route="plan"><span>📐</span>PLAN</button>
        <button data-route="stash"><span>🧰</span>MY SHIT</button>
        <button data-route="look"><span>👁</span>LOOK</button>
        <button data-route="library"><span>📚</span>LIBRARY</button>
        <button id="wtfButton"><span>WTF?</span>EXPLAIN</button>
        <div class="voice-cluster">
          <button id="bannerTalk" class="voice-main">🎙 TALK</button>
          <button id="bannerAI">🧠 ASK WTF</button>
          <button id="bannerRead">🔊 READ / TALK BACK</button>
        </div>
      </nav>
    </div>
  </header>

  <div class="app-shell">
    <div class="status-row" style="padding:0 2px 12px;border:0">
      <span id="version" class="muted tiny">v0.5.0</span>
      <span id="voiceState" class="voice-state">VOICE READY</span>
      <span id="cloudBadge" class="cloud-chip off">LOCAL</span>
      <button id="stackChip" class="stack-chip off" type="button">CF STACK</button>
      <button id="stackButton" class="secondary" type="button" style="padding:6px 9px;font-size:10px">WHAT'S LIVE?</button>
    </div>
    <main id="view"></main>
  </div>

  <nav class="dock" aria-label="Mobile navigation">
    <button data-route="build"><span>🔨</span>BUILD</button>
    <button data-route="plan"><span>📐</span>PLAN</button>
    <button data-route="stash"><span>🪵</span>MY SHIT</button>
    <button data-route="look"><span>📷</span>LOOK</button>
    <button data-route="library"><span>📚</span>LIBRARY</button>
  </nav>
  <button id="voiceFab" class="voice-fab" type="button" aria-label="Talk to WTF">🎙</button>

  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
  <script type="module" src="/app-v5.js"></script>
  <script type="module" src="/library-v5.js"></script>
</body>
</html>
