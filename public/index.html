<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14130f">
  <meta name="description" content="WTF — Shed Happens: visual, beginner-first building help.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
  <title>WTF — Shed Happens</title>
</head>
<body>
  <div class="wood" aria-hidden="true"></div>
  <div id="app">
    <header class="topbar">
      <button class="brand" aria-label="Go home"><span class="brand-mark">WTF</span><span><b>SHED HAPPENS</b><small>STUPID SIMPLE BUILDER</small></span></button>
      <div class="header-actions"><span id="version" class="version"></span><button class="wtf-fab" id="wtfButton">WTF?</button></div>
    </header>
    <main id="view"></main>
    <nav class="dock" aria-label="Primary navigation">
      <button data-route="build"><span>🔨</span>BUILD</button>
      <button data-route="plan"><span>📐</span>PLAN</button>
      <button data-route="stash"><span>🪵</span>MY SHIT</button>
      <button data-route="look"><span>📷</span>LOOK</button>
      <button data-route="library"><span>🧰</span>LIBRARY</button>
    </nav>
  </div>
  <dialog id="wtfDialog">
    <form method="dialog" class="steel-card modal">
      <button class="close" value="close" aria-label="Close">×</button>
      <p class="eyebrow">WTF TRANSLATOR</p><h2 id="wtfTitle">What am I looking at?</h2>
      <p id="wtfBody">Plain English first. Trade language second.</p>
      <div class="modal-actions"><button value="close" class="primary">GOT IT</button></div>
    </form>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
